<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS – Sitzungs-Analyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12161f;
    --bg-alt: #171d28;
    --panel: #1a212c;
    --panel-2: #1f2733;
    --line: #2b3340;
    --line-soft: #232b38;
    --brass: #cc9a54;
    --brass-bright: #e0b374;
    --brass-dim: #8a6b3d;
    --teal: #4fb0a5;
    --teal-bright: #6ac9be;
    --rust: #c1584a;
    --rust-bright: #dd7568;
    --text: #eae6da;
    --text-dim: #9aa2b1;
    --text-faint: #5b6472;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Source Serif 4', Georgia, serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1.5px) 0 0/24px 24px,
      radial-gradient(ellipse at top, var(--bg-alt) 0%, var(--bg) 60%);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }
  ::selection { background: var(--brass-dim); color: var(--text); }
  button, input, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }

  #app { max-width: 1180px; margin: 0 auto; padding: 28px 28px 60px; }

  /* Header */
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    padding-bottom: 20px; margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
    animation: rise .5s ease both;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.06em; color: var(--text); }
  .brand-sub { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 18px; }
  .session-clock {
    font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.05em;
    color: var(--brass-bright); background: var(--panel); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: var(--radius-sm);
  }
  .tabs { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .tab-btn {
    border: none; background: transparent; color: var(--text-dim);
    font-family: var(--font-display); font-size: 13px; font-weight: 600;
    padding: 7px 16px; border-radius: 999px; transition: all .2s ease;
  }
  .tab-btn.active { background: var(--brass); color: #1a1408; }

  /* Stats bar */
  .stats-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; animation: rise .5s .05s ease both; }
  .stat-chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 10px 16px; display: flex; flex-direction: column; align-items: center; min-width: 84px;
  }
  .stat-num { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
  .stat-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin-top: 2px; }
  .stat-chip-estimate { border-color: var(--brass-dim); }

  /* Layout */
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; animation: rise .5s .1s ease both; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; min-height: 320px; }
  .panel-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 14px; }

  .capture-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .capture-row input[type=text] {
    flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 9px 12px; font-size: 14px;
  }
  .log-capture { flex-direction: column; }
  .log-capture textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 9px 12px; font-size: 14px; resize: vertical;
  }
  .log-capture-row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .type-select { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px; }
  .type-btn { border: none; background: transparent; color: var(--text-faint); font-size: 15px; width: 30px; height: 30px; border-radius: var(--radius-sm); transition: all .15s ease; }
  .type-btn.active { background: var(--panel-2); color: var(--brass-bright); }
  .log-capture-row2 input[type=text] {
    flex: 1; min-width: 140px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 8px 10px; font-family: var(--font-mono); font-size: 12px;
  }

  .btn {
    border: none; border-radius: var(--radius-sm); padding: 9px 18px;
    font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .02em;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: var(--brass-dim); color: var(--brass-bright); }
  .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--line); }
  .btn-secondary:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-primary { background: var(--brass); color: #1a1408; }
  .btn-primary:hover:not(:disabled) { background: var(--brass-bright); box-shadow: 0 0 24px rgba(204,154,84,.35); transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--panel-2); color: var(--text-faint); cursor: not-allowed; }
  .icon-btn { background: transparent; border: none; color: var(--text-faint); font-size: 16px; line-height: 1; padding: 4px 8px; border-radius: var(--radius-sm); }
  .icon-btn:hover { color: var(--rust-bright); background: var(--panel-2); }

  .task-list, .log-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 420px; flex: 1; }
  .task-item { background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 10px 12px; }
  .task-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .task-title { flex: 1; min-width: 120px; font-size: 14px; }
  .status-select { display: flex; gap: 4px; flex-wrap: wrap; }
  .status-btn {
    border: 1px solid var(--line); background: transparent; color: var(--text-faint);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .03em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 999px; transition: all .15s ease;
  }
  .status-btn.active { background: var(--st-color, var(--brass)); border-color: transparent; color: #14181f; }
  .task-note {
    margin-top: 8px; width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 13px;
    padding: 8px 10px; resize: vertical; min-height: 40px;
  }

  .log-item { background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 10px 12px; }
  .log-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .log-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .log-type-chip { font-family: var(--font-mono); font-size: 10px; letter-spacing: .03em; color: var(--tc); border: 1px solid currentColor; border-radius: 999px; padding: 2px 8px; }
  .log-source-chip { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); background: var(--panel-2); border-radius: 999px; padding: 2px 8px; }
  .log-text { margin: 0; font-size: 14px; padding-left: 2px; }

  .empty-hint { color: var(--text-faint); font-size: 13px; font-style: italic; padding: 10px 2px; }

  .action-bar { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }

  /* Overlay */
  .overlay { position: fixed; inset: 0; background: rgba(8,10,14,.72); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50; animation: fadeIn .2s ease; }
  .overlay[hidden] { display: none; }
  .overlay-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 32px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: rise .3s ease both; }
  .overlay-close { position: absolute; top: 14px; right: 16px; background: transparent; border: none; color: var(--text-faint); font-size: 22px; }
  .overlay-close:hover { color: var(--text); }
  .overlay-loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; }
  .loading-text { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; color: var(--text-dim); }
  .overlay-hero { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 22px; text-align: center; }
  .analysis-summary { font-size: 15px; color: var(--text); max-width: 480px; margin: 0 auto; }
  .analysis-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 18px 0; }
  .analysis-subtitle { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 8px; }
  .analysis-list, .analysis-reco-list { margin: 0; padding-left: 18px; font-size: 13.5px; }
  .analysis-list li, .analysis-reco-list li { margin-bottom: 6px; }
  .analysis-reco-list li::marker { color: var(--brass); font-family: var(--font-display); font-weight: 700; }
  .overlay-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .overlay-error { text-align: center; padding: 20px 0; }
  .error-title { font-family: var(--font-display); font-weight: 700; color: var(--rust-bright); margin: 0 0 8px; }
  .error-text { color: var(--text-dim); font-size: 13px; margin: 0 0 18px; }

  .raw-details { margin-top: 16px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
  .raw-details summary { cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-faint); }
  .raw-details summary:hover { color: var(--text-dim); }
  .raw-row { font-size: 12.5px; color: var(--text-dim); padding: 4px 0; border-bottom: 1px dashed var(--line-soft); }
  .raw-tasks, .raw-logs { margin-top: 10px; }

  /* Gauge */
  .gauge-svg { display: block; }
  .gauge-number { font-family: var(--font-display); font-size: 40px; font-weight: 700; }
  .gauge-percent { font-size: 18px; }
  .gauge-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; fill: var(--text-faint); }

  /* History */
  .history-list { display: flex; flex-direction: column; gap: 10px; animation: rise .4s ease both; }
  .history-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .history-summary { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: transparent; border: none; padding: 16px 20px; text-align: left; }
  .history-summary-left { display: flex; flex-direction: column; gap: 4px; }
  .history-date { font-family: var(--font-display); font-size: 14px; font-weight: 600; }
  .history-stats { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .history-pct { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
  .history-pct-muted { color: var(--text-faint); }
  .history-detail { padding: 0 20px 20px; border-top: 1px solid var(--line-soft); padding-top: 16px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--brass-dim); color: var(--text); padding: 10px 20px; border-radius: 999px; font-size: 13px; z-index: 60; animation: fadeIn .2s ease; }
  .toast.toast-error { border-color: var(--rust); color: var(--rust-bright); }

  .footnote { margin-top: 30px; text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); letter-spacing: .02em; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  @media (max-width: 820px) {
    .columns { grid-template-columns: 1fr; }
    .analysis-columns { grid-template-columns: 1fr; }
    .app-header { flex-direction: column; align-items: flex-start; }
    #app { padding: 20px 16px 50px; }
  }
</style>
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="13" stroke="#2b3340" stroke-width="2.5"/>
        <path d="M 6.4 21.4 A 13 13 0 1 1 25.6 21.4" stroke="#cc9a54" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <circle cx="16" cy="16" r="2.5" fill="#cc9a54"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">ATLAS</span>
        <span class="brand-sub">Automatisiertes Tages-Log &amp; Analyse-System</span>
      </div>
    </div>
    <div class="header-right">
      <div class="session-clock" id="session-clock" title="Sitzungsdauer">00:00:00</div>
      <nav class="tabs" role="tablist">
        <button class="tab-btn active" id="tab-session" data-tab="session" role="tab" aria-selected="true" aria-controls="view-session">Session</button>
        <button class="tab-btn" id="tab-history" data-tab="history" role="tab" aria-selected="false" aria-controls="view-history">Verlauf</button>
      </nav>
    </div>
  </header>

  <section class="stats-bar" id="stats-bar"></section>

  <main class="view" id="view-session" role="tabpanel" aria-labelledby="tab-session">
    <div class="columns">
      <section class="panel tasks-panel">
        <h2 class="panel-title">Aufgaben</h2>
        <form id="task-form" class="capture-row">
          <input type="text" id="task-input" placeholder="Neue Aufgabe erfassen…" aria-label="Neue Aufgabe" autocomplete="off" required>
          <button type="submit" class="btn btn-ghost">+ Hinzufügen</button>
        </form>
        <ul class="task-list" id="task-list"></ul>
        <p class="empty-hint" id="task-empty-hint">Noch keine Aufgaben erfasst.</p>
      </section>

      <section class="panel log-panel">
        <h2 class="panel-title">Log</h2>
        <form id="log-form" class="capture-row log-capture">
          <textarea id="log-input" rows="2" placeholder="Was ist gerade passiert? (Fortschritt, Problem, Idee …)" aria-label="Neuer Log-Eintrag" required></textarea>
          <div class="log-capture-row2">
            <div class="type-select" id="log-type-select">
              <button type="button" class="type-btn active" data-type="fortschritt" title="Fortschritt" aria-label="Fortschritt">↗</button>
              <button type="button" class="type-btn" data-type="problem" title="Problem" aria-label="Problem">▲</button>
              <button type="button" class="type-btn" data-type="idee" title="Idee" aria-label="Idee">★</button>
              <button type="button" class="type-btn" data-type="sonstiges" title="Sonstiges" aria-label="Sonstiges">•</button>
            </div>
            <input type="text" id="log-source" placeholder="Quelle (optional, z. B. Git, Meeting, Trello)" aria-label="Quelle (optional)" autocomplete="off">
            <button type="submit" class="btn btn-ghost">Eintragen</button>
          </div>
        </form>
        <ul class="log-list" id="log-list"></ul>
        <p class="empty-hint" id="log-empty-hint">Noch keine Log-Einträge.</p>
      </section>
    </div>

    <div class="action-bar">
      <button class="btn btn-secondary" id="reset-session-btn">Neue Session starten</button>
      <button class="btn btn-primary" id="end-session-btn" disabled>Session beenden &amp; analysieren</button>
    </div>
  </main>

  <main class="view" id="view-history" role="tabpanel" aria-labelledby="tab-history" hidden>
    <div class="history-list" id="history-list"></div>
    <p class="empty-hint" id="history-empty-hint">Noch keine abgeschlossene Sitzung.</p>
  </main>

  <p class="footnote">Alle Eingaben werden lokal in diesem Browser gespeichert. Die Analyse wird von Claude (Anthropic) erstellt.</p>
</div>

<div class="overlay" id="analysis-overlay" hidden>
  <div class="overlay-panel" role="dialog" aria-modal="true" aria-label="Sitzungs-Analyse">
    <button class="overlay-close" id="overlay-close" aria-label="Schließen">×</button>
    <div id="overlay-content"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY_SESSION = 'atlas-current-session';
  var STORAGE_KEY_HISTORY = 'atlas-history';
  var MAX_HISTORY = 30;

  var TYPE_META = {
    fortschritt: { label: 'Fortschritt', icon: '↗', color: '#4fb0a5' },
    problem:     { label: 'Problem',     icon: '▲', color: '#c1584a' },
    idee:        { label: 'Idee',        icon: '★', color: '#cc9a54' },
    sonstiges:   { label: 'Sonstiges',   icon: '•', color: '#9aa2b1' }
  };

  var STATUS_META = {
    offen:     { label: 'Offen',     color: '#5b6472' },
    in_arbeit: { label: 'In Arbeit', color: '#cc9a54' },
    fertig:    { label: 'Fertig',    color: '#4fb0a5' },
    blockiert: { label: 'Blockiert', color: '#c1584a' }
  };
  var STATUS_ORDER = ['offen', 'in_arbeit', 'fertig', 'blockiert'];

  var session = createEmptySession();
  var history = [];
  var clockInterval = null;
  var selectedLogType = 'fortschritt';

  function createEmptySession() {
    return { startedAt: Date.now(), tasks: [], logs: [] };
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtDateTime(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' · ' + fmtTime(ts);
  }
  function fmtDuration(ms) {
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    return [h, m, s].map(function (n) { return String(n).padStart(2, '0'); }).join(':');
  }

  /* ---------- Persistence ---------- */
  function loadState() {
    try {
      var s = localStorage.getItem(STORAGE_KEY_SESSION);
      if (s) session = JSON.parse(s);
    } catch (e) { /* keine gespeicherte Session */ }
    try {
      var h = localStorage.getItem(STORAGE_KEY_HISTORY);
      if (h) history = JSON.parse(h);
    } catch (e) { /* kein Verlauf */ }
  }

  var saveSessionTimeout = null;
  function persistSession() {
    clearTimeout(saveSessionTimeout);
    saveSessionTimeout = setTimeout(function () {
      try {
        localStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify(session));
      } catch (e) { showToast('Speichern fehlgeschlagen', true); }
    }, 250);
  }
  function persistHistory() {
    try {
      localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
    } catch (e) { showToast('Verlauf konnte nicht gespeichert werden', true); }
  }

  /* ---------- Mutations ---------- */
  function addTask(title) {
    session.tasks.unshift({ id: uid(), title: title.trim(), status: 'offen', note: '', createdAt: Date.now() });
    persistSession(); renderAll();
  }
  function setTaskStatus(id, status) {
    var t = session.tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    t.status = status;
    persistSession(); renderAll();
  }
  function setTaskNote(id, note) {
    var t = session.tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    t.note = note;
    persistSession();
  }
  function removeTask(id) {
    session.tasks = session.tasks.filter(function (x) { return x.id !== id; });
    persistSession(); renderAll();
  }
  function addLog(text, type, source) {
    session.logs.unshift({ id: uid(), text: text.trim(), type: type, source: (source || '').trim(), createdAt: Date.now() });
    persistSession(); renderAll();
  }
  function removeLog(id) {
    session.logs = session.logs.filter(function (x) { return x.id !== id; });
    persistSession(); renderAll();
  }

  /* ---------- Stats ---------- */
  function computeStats() {
    var counts = { offen: 0, in_arbeit: 0, fertig: 0, blockiert: 0 };
    session.tasks.forEach(function (t) { counts[t.status]++; });
    var total = session.tasks.length;
    var liveEstimate = total ? Math.round((counts.fertig / total) * 100) : null;
    return {
      total: total, offen: counts.offen, in_arbeit: counts.in_arbeit, fertig: counts.fertig, blockiert: counts.blockiert,
      logsCount: session.logs.length, liveEstimate: liveEstimate, durationMs: Date.now() - session.startedAt
    };
  }

  function listOrEmpty(items, emptyText, ordered) {
    if (!items || !items.length) return '<p class="empty-hint">' + esc(emptyText) + '</p>';
    var tag = ordered ? 'ol' : 'ul';
    var cls = ordered ? 'analysis-reco-list' : 'analysis-list';
    var rows = items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
    return '<' + tag + ' class="' + cls + '">' + rows + '</' + tag + '>';
  }

  /* ---------- Rendering ---------- */
  function renderStats() {
    var s = computeStats();
    var html = ''
      + '<div class="stat-chip"><span class="stat-num">' + s.offen + '</span><span class="stat-label">Offen</span></div>'
      + '<div class="stat-chip"><span class="stat-num" style="color:#cc9a54">' + s.in_arbeit + '</span><span class="stat-label">In Arbeit</span></div>'
      + '<div class="stat-chip"><span class="stat-num" style="color:#4fb0a5">' + s.fertig + '</span><span class="stat-label">Fertig</span></div>'
      + '<div class="stat-chip"><span class="stat-num" style="color:#c1584a">' + s.blockiert + '</span><span class="stat-label">Blockiert</span></div>'
      + '<div class="stat-chip"><span class="stat-num">' + s.logsCount + '</span><span class="stat-label">Log-Einträge</span></div>';
    if (s.liveEstimate !== null) {
      html += '<div class="stat-chip stat-chip-estimate"><span class="stat-num">' + s.liveEstimate + '%</span><span class="stat-label">Live-Schätzung</span></div>';
    }
    document.getElementById('stats-bar').innerHTML = html;
  }

  function taskRow(t) {
    var statusBtns = STATUS_ORDER.map(function (st) {
      var active = st === t.status ? ' active' : '';
      return '<button type="button" class="status-btn' + active + '" data-status="' + st + '" data-id="' + t.id + '" style="--st-color:' + STATUS_META[st].color + '">' + STATUS_META[st].label + '</button>';
    }).join('');
    var noteHtml = t.status === 'blockiert'
      ? '<textarea class="task-note" data-id="' + t.id + '" placeholder="Was blockiert diese Aufgabe?">' + esc(t.note) + '</textarea>'
      : '';
    return '<li class="task-item" data-id="' + t.id + '">'
      + '<div class="task-row">'
      + '<span class="status-dot" style="background:' + STATUS_META[t.status].color + '"></span>'
      + '<span class="task-title">' + esc(t.title) + '</span>'
      + '<div class="status-select">' + statusBtns + '</div>'
      + '<button type="button" class="icon-btn remove-task-btn" data-id="' + t.id + '" aria-label="Aufgabe entfernen">×</button>'
      + '</div>' + noteHtml + '</li>';
  }
  function renderTasks() {
    var listEl = document.getElementById('task-list');
    var emptyHint = document.getElementById('task-empty-hint');
    emptyHint.style.display = session.tasks.length ? 'none' : 'block';
    listEl.innerHTML = session.tasks.map(taskRow).join('');
  }

  function logRow(l) {
    var sourceChip = l.source ? '<span class="log-source-chip">' + esc(l.source) + '</span>' : '';
    var meta = TYPE_META[l.type] || TYPE_META.sonstiges;
    return '<li class="log-item">'
      + '<div class="log-meta">'
      + '<span class="log-time">' + fmtTime(l.createdAt) + '</span>'
      + '<span class="log-type-chip" style="--tc:' + meta.color + '">' + meta.icon + ' ' + meta.label + '</span>'
      + sourceChip
      + '<button type="button" class="icon-btn remove-log-btn" data-id="' + l.id + '" aria-label="Eintrag entfernen">×</button>'
      + '</div>'
      + '<p class="log-text">' + esc(l.text) + '</p>'
      + '</li>';
  }
  function renderLogs() {
    var listEl = document.getElementById('log-list');
    var emptyHint = document.getElementById('log-empty-hint');
    emptyHint.style.display = session.logs.length ? 'none' : 'block';
    listEl.innerHTML = session.logs.map(logRow).join('');
  }

  function renderActionBar() {
    var s = computeStats();
    document.getElementById('end-session-btn').disabled = !(s.total > 0 || s.logsCount > 0);
  }

  function renderClock() {
    var el = document.getElementById('session-clock');
    if (el) el.textContent = fmtDuration(Date.now() - session.startedAt);
  }

  function renderAnalysisBlock(analysis, tasks, logs) {
    if (!analysis) return '<p class="empty-hint">Keine KI-Analyse für diese Sitzung gespeichert.</p>';
    var rawTasksHtml = (tasks && tasks.length)
      ? tasks.map(function (t) {
          return '<div class="raw-row"><span class="status-dot" style="background:' + STATUS_META[t.status].color + '"></span> ' + esc(t.title) + (t.note ? ' — ' + esc(t.note) : '') + '</div>';
        }).join('')
      : '<p class="empty-hint">Keine Aufgaben.</p>';
    var rawLogsHtml = (logs && logs.length)
      ? logs.map(function (l) {
          var meta = TYPE_META[l.type] || TYPE_META.sonstiges;
          return '<div class="raw-row"><span class="log-time">' + fmtTime(l.createdAt) + '</span> [' + meta.label + '] ' + esc(l.text) + '</div>';
        }).join('')
      : '<p class="empty-hint">Keine Log-Einträge.</p>';

    return '<p class="analysis-summary">' + esc(analysis.zusammenfassung || '') + '</p>'
      + '<div class="analysis-columns">'
      + '<div><h4 class="analysis-subtitle" style="color:var(--teal)">Was lief gut</h4>' + listOrEmpty(analysis.was_lief_gut, 'Keine besonderen Highlights erkannt.', false) + '</div>'
      + '<div><h4 class="analysis-subtitle" style="color:var(--rust)">Wo es hakt</h4>' + listOrEmpty(analysis.probleme, 'Keine Blocker erkannt – sauberer Lauf.', false) + '</div>'
      + '</div>'
      + '<h4 class="analysis-subtitle" style="color:var(--brass)">Empfehlungen</h4>'
      + listOrEmpty(analysis.empfehlungen, 'Keine Empfehlungen.', true)
      + '<details class="raw-details"><summary>Rohdaten dieser Sitzung</summary>'
      + '<div class="raw-tasks">' + rawTasksHtml + '</div>'
      + '<div class="raw-logs">' + rawLogsHtml + '</div>'
      + '</details>';
  }

  function renderHistory() {
    var listEl = document.getElementById('history-list');
    var emptyHint = document.getElementById('history-empty-hint');
    emptyHint.style.display = history.length ? 'none' : 'block';
    listEl.innerHTML = history.map(function (h, idx) {
      var hasPct = h.analysis && typeof h.analysis.erfolgsquote === 'number';
      var pct = hasPct ? h.analysis.erfolgsquote : null;
      var pctHtml = hasPct
        ? '<span class="history-pct" style="color:' + ratingColorHex(pct) + '">' + pct + '%</span>'
        : '<span class="history-pct history-pct-muted">–</span>';
      return '<div class="history-card">'
        + '<button type="button" class="history-summary" data-idx="' + idx + '">'
        + '<div class="history-summary-left">'
        + '<span class="history-date">' + fmtDateTime(h.startedAt) + ' – ' + fmtTime(h.endedAt) + '</span>'
        + '<span class="history-stats">' + h.taskCount + ' Aufgaben · ' + h.logCount + ' Logs · ' + fmtDuration(h.endedAt - h.startedAt) + '</span>'
        + '</div>' + pctHtml + '</button>'
        + '<div class="history-detail" id="history-detail-' + idx + '" hidden>' + renderAnalysisBlock(h.analysis, h.tasks, h.logs) + '</div>'
        + '</div>';
    }).join('');

    Array.prototype.forEach.call(listEl.querySelectorAll('.history-summary'), function (btn) {
      btn.addEventListener('click', function () {
        var detail = document.getElementById('history-detail-' + btn.getAttribute('data-idx'));
        detail.hidden = !detail.hidden;
      });
    });
  }

  function renderAll() {
    renderStats();
    renderTasks();
    renderLogs();
    renderActionBar();
  }

  /* ---------- Gauge ---------- */
  function ratingColorHex(p) {
    if (p >= 70) return '#4fb0a5';
    if (p >= 40) return '#cc9a54';
    return '#c1584a';
  }
  var ARC_LEN = 376.99;
  function gaugeSvg(pct, size) {
    size = size || 200;
    var clamped = Math.max(0, Math.min(100, pct));
    var color = ratingColorHex(clamped);
    var offsetTarget = ARC_LEN * (1 - clamped / 100);
    return ''
      + '<svg viewBox="0 0 200 200" width="' + size + '" height="' + size + '" class="gauge-svg">'
      + '<path d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" fill="none" stroke="#2b3340" stroke-width="14" stroke-linecap="round"/>'
      + '<line x1="40.6" y1="159.4" x2="33.5" y2="166.5" stroke="#5b6472" stroke-width="2"/>'
      + '<line x1="22.4" y1="67.9" x2="13.2" y2="64.0" stroke="#5b6472" stroke-width="2"/>'
      + '<line x1="100" y1="16" x2="100" y2="6" stroke="#5b6472" stroke-width="2"/>'
      + '<line x1="177.6" y1="67.9" x2="186.8" y2="64.0" stroke="#5b6472" stroke-width="2"/>'
      + '<line x1="159.4" y1="159.4" x2="166.5" y2="166.5" stroke="#5b6472" stroke-width="2"/>'
      + '<path d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" fill="none" stroke="' + color + '" stroke-width="14" stroke-linecap="round" '
      + 'stroke-dasharray="' + ARC_LEN + ' ' + ARC_LEN + '" stroke-dashoffset="' + ARC_LEN + '" class="gauge-value" data-target="' + offsetTarget + '" '
      + 'style="filter:drop-shadow(0 0 8px ' + color + '66)"></path>'
      + '<text x="100" y="104" text-anchor="middle" class="gauge-number" fill="' + color + '">' + Math.round(clamped) + '<tspan class="gauge-percent">%</tspan></text>'
      + '<text x="100" y="128" text-anchor="middle" class="gauge-label">ERFOLGSQUOTE</text>'
      + '</svg>';
  }
  function animateGauge(container) {
    var path = container.querySelector('.gauge-value');
    if (!path) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        path.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)';
        path.style.strokeDashoffset = path.getAttribute('data-target');
      });
    });
  }

  /* ---------- Prompt & API ---------- */
  function buildAnalysisPrompt() {
    var s = computeStats();
    var durationMin = Math.max(1, Math.round(s.durationMs / 60000));
    var tasksText = session.tasks.length
      ? session.tasks.map(function (t) {
          return '- [' + STATUS_META[t.status].label + '] ' + t.title + (t.note ? ' (Notiz: ' + t.note + ')' : '');
        }).join('\n')
      : '(keine Aufgaben erfasst)';
    var logsText = session.logs.length
      ? session.logs.map(function (l) {
          var meta = TYPE_META[l.type] || TYPE_META.sonstiges;
          return '- ' + fmtTime(l.createdAt) + ' [' + meta.label + (l.source ? ' · ' + l.source : '') + '] ' + l.text;
        }).join('\n')
      : '(keine Log-Einträge erfasst)';

    return 'Du bist ATLAS, ein präziser und ehrlicher Arbeits-Analyst. Du bekommst Rohdaten einer Arbeitssitzung: Aufgaben mit Status und Log-Einträge aus verschiedenen Quellen (z. B. Code, Meetings, Tools). Analysiere ehrlich, konkret und wohlwollend-direkt – nicht beschönigend, aber auch nicht überhart.\n\n'
      + 'Antworte AUSSCHLIESSLICH mit einem JSON-Objekt in genau diesem Format. Kein Markdown-Codeblock, keine Einleitung, kein Text davor oder danach:\n\n'
      + '{"zusammenfassung": "2-3 Sätze Gesamtbild", "erfolgsquote": Zahl 0-100, "was_lief_gut": ["..."], "probleme": ["..."], "empfehlungen": ["..."]}\n\n'
      + 'Regeln: "was_lief_gut" 0-4 konkrete Punkte (leeres Array wenn nichts Positives). "probleme" 0-4 konkrete Probleme/Blocker (leeres Array wenn keine). "empfehlungen" 2-4 konkrete, umsetzbare nächste Schritte, nach Priorität geordnet (wichtigstes zuerst).\n\n'
      + 'Sitzungsdauer: ca. ' + durationMin + ' Minuten\n'
      + 'Aufgaben (' + session.tasks.length + '):\n' + tasksText + '\n\n'
      + 'Log-Einträge (' + session.logs.length + '):\n' + logsText;
  }

  async function callAnalysisApi(prompt) {
    var response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt })
    });
    var data = null;
    try { data = await response.json(); } catch (e) { /* keine JSON-Antwort */ }
    if (!response.ok) {
      throw new Error((data && data.error) || ('API antwortete mit Status ' + response.status));
    }
    if (!data || typeof data.text !== 'string') throw new Error('Keine Textantwort erhalten');
    var cleaned = data.text.trim();
    cleaned = cleaned.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '').trim();
    var firstBrace = cleaned.indexOf('{');
    var lastBrace = cleaned.lastIndexOf('}');
    if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
      cleaned = cleaned.slice(firstBrace, lastBrace + 1);
    }
    var parsed = JSON.parse(cleaned);
    return {
      zusammenfassung: parsed.zusammenfassung || '',
      erfolgsquote: typeof parsed.erfolgsquote === 'number' ? Math.max(0, Math.min(100, Math.round(parsed.erfolgsquote))) : 0,
      was_lief_gut: Array.isArray(parsed.was_lief_gut) ? parsed.was_lief_gut : [],
      probleme: Array.isArray(parsed.probleme) ? parsed.probleme : [],
      empfehlungen: Array.isArray(parsed.empfehlungen) ? parsed.empfehlungen : []
    };
  }

  /* ---------- Overlay flow ---------- */
  function openOverlay() {
    document.getElementById('analysis-overlay').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeOverlay() {
    document.getElementById('analysis-overlay').hidden = true;
    document.body.style.overflow = '';
  }
  function renderOverlayLoading() {
    document.getElementById('overlay-content').innerHTML =
      '<div class="overlay-loading">' + gaugeSvg(0, 160) + '<p class="loading-text">ATLAS analysiert deine Sitzung …</p></div>';
  }
  function renderOverlayError(message) {
    document.getElementById('overlay-content').innerHTML =
      '<div class="overlay-error"><p class="error-title">Analyse fehlgeschlagen</p><p class="error-text">' + esc(message) + '</p>'
      + '<div class="overlay-actions"><button class="btn btn-secondary" id="retry-analysis-btn">Erneut versuchen</button>'
      + '<button class="btn btn-ghost" id="save-without-ai-btn">Ohne KI-Analyse speichern</button></div></div>';
    document.getElementById('retry-analysis-btn').addEventListener('click', runAnalysisFlow);
    document.getElementById('save-without-ai-btn').addEventListener('click', function () { finalizeSession(null); });
  }
  function renderOverlayResult(analysis) {
    var pct = typeof analysis.erfolgsquote === 'number' ? analysis.erfolgsquote : 0;
    document.getElementById('overlay-content').innerHTML =
      '<div class="overlay-result"><div class="overlay-hero">' + gaugeSvg(pct, 180)
      + '<p class="analysis-summary">' + esc(analysis.zusammenfassung || '') + '</p></div>'
      + renderAnalysisBlock(analysis, session.tasks, session.logs)
      + '<div class="overlay-actions"><button class="btn btn-primary" id="save-session-btn">In Verlauf speichern &amp; neue Session starten</button>'
      + '<button class="btn btn-ghost" id="back-to-session-btn">Zurück zur Session</button></div></div>';
    animateGauge(document.getElementById('overlay-content'));
    document.getElementById('save-session-btn').addEventListener('click', function () { finalizeSession(analysis); });
    document.getElementById('back-to-session-btn').addEventListener('click', closeOverlay);
  }
  async function runAnalysisFlow() {
    openOverlay();
    renderOverlayLoading();
    animateGauge(document.getElementById('overlay-content'));
    try {
      var prompt = buildAnalysisPrompt();
      var analysis = await callAnalysisApi(prompt);
      renderOverlayResult(analysis);
    } catch (e) {
      renderOverlayError(e && e.message ? e.message : 'Unbekannter Fehler');
    }
  }
  function finalizeSession(analysis) {
    var s = computeStats();
    history.unshift({
      id: uid(), startedAt: session.startedAt, endedAt: Date.now(),
      taskCount: s.total, logCount: s.logsCount,
      tasks: session.tasks, logs: session.logs, analysis: analysis
    });
    if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
    persistHistory();
    session = createEmptySession();
    persistSession();
    closeOverlay();
    renderAll();
    renderHistory();
    showToast('Session gespeichert.');
  }

  /* ---------- Toast ---------- */
  var toastTimeout = null;
  function showToast(msg, isError) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    el.classList.toggle('toast-error', !!isError);
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function () { el.hidden = true; }, 3200);
  }

  /* ---------- Tabs ---------- */
  function switchTab(tab) {
    document.getElementById('view-session').hidden = tab !== 'session';
    document.getElementById('view-history').hidden = tab !== 'history';
    Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function (b) {
      var active = b.getAttribute('data-tab') === tab;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    if (tab === 'history') renderHistory();
  }

  /* ---------- Events ---------- */
  function wireEvents() {
    document.getElementById('task-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('task-input');
      if (!input.value.trim()) return;
      addTask(input.value);
      input.value = '';
      input.focus();
    });

    document.getElementById('task-list').addEventListener('click', function (e) {
      var statusBtn = e.target.closest('.status-btn');
      if (statusBtn) { setTaskStatus(statusBtn.getAttribute('data-id'), statusBtn.getAttribute('data-status')); return; }
      var removeBtn = e.target.closest('.remove-task-btn');
      if (removeBtn) { removeTask(removeBtn.getAttribute('data-id')); return; }
    });
    document.getElementById('task-list').addEventListener('input', function (e) {
      if (e.target.classList.contains('task-note')) setTaskNote(e.target.getAttribute('data-id'), e.target.value);
    });

    document.getElementById('log-type-select').addEventListener('click', function (e) {
      var btn = e.target.closest('.type-btn');
      if (!btn) return;
      selectedLogType = btn.getAttribute('data-type');
      Array.prototype.forEach.call(document.querySelectorAll('.type-btn'), function (b) { b.classList.toggle('active', b === btn); });
    });

    document.getElementById('log-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var textEl = document.getElementById('log-input');
      var sourceEl = document.getElementById('log-source');
      if (!textEl.value.trim()) return;
      addLog(textEl.value, selectedLogType, sourceEl.value);
      textEl.value = '';
      sourceEl.value = '';
      textEl.focus();
    });

    document.getElementById('log-list').addEventListener('click', function (e) {
      var removeBtn = e.target.closest('.remove-log-btn');
      if (removeBtn) removeLog(removeBtn.getAttribute('data-id'));
    });

    document.getElementById('end-session-btn').addEventListener('click', runAnalysisFlow);

    document.getElementById('reset-session-btn').addEventListener('click', function () {
      var s = computeStats();
      if ((s.total > 0 || s.logsCount > 0) && !confirm('Aktuelle Session (inkl. aller Aufgaben & Logs) verwerfen und neu starten? Sie wird NICHT im Verlauf gespeichert.')) return;
      session = createEmptySession();
      persistSession();
      renderAll();
      showToast('Neue Session gestartet.');
    });

    Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function (b) {
      b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
    });
    document.getElementById('overlay-close').addEventListener('click', closeOverlay);
    document.getElementById('analysis-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'analysis-overlay') closeOverlay();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !document.getElementById('analysis-overlay').hidden) closeOverlay();
    });
  }

  function init() {
    loadState();
    wireEvents();
    renderAll();
    renderClock();
    clockInterval = setInterval(renderClock, 1000);
  }

  init();
})();
</script>
</body>
</html>
